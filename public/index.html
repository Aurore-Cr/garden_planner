<script>
/* ============================= UTILITAIRES ============================= */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
const uid = ()=> Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2,'0');
function toISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return toISO(new Date()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dateStr, n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return toISO(d); }
function dayOfYear(dateStr){ const d=parseISO(dateStr); const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/864e5); }
function weekIndexSince(startDateStr, dateStr){ const diff = (parseISO(dateStr)-parseISO(startDateStr))/864e5; return Math.floor(diff/7); }
function fmtDateLong(dateStr){
  const d = parseISO(dateStr);
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function fmtDateShort(dateStr){
  const d = parseISO(dateStr);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function seasonOf(dateStr){
  const m = parseISO(dateStr).getMonth()+1; // 1-12
  if([12,1,2].includes(m)) return 'hiver';
  if([3,4,5].includes(m)) return 'printemps';
  if([6,7,8].includes(m)) return 'ete';
  return 'automne';
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function pickDeterministic(arr, seed){ if(!arr.length) return null; return arr[hashStr(seed)%arr.length]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function toast(msg){
  const root=$('#toast-root'); const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  root.appendChild(el); setTimeout(()=>el.remove(),2200);
}
function round1(n){ return Math.round(n*10)/10; }

/* ============================= IMPORT GARMIN (CSV manuel) ============================= */
function parseFlexibleDate(str){
  str = (str||'').trim();
  let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return null;
}
function parseFlexibleHours(str){
  str = (str||'').trim();
  if(!str) return undefined;
  if(str.includes(':')){ const [h,mn] = str.split(':').map(Number); return round1(h + (mn||0)/60); }
  const v = parseFloat(str.replace(',','.'));
  return isNaN(v)? undefined : v;
}
function parseCSVRows(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',').map(c=>c.trim());
    const row = {}; headers.forEach((h,i)=> row[h]=cells[i]);
    return row;
  });
}
function importGarminCSV(text, kind){
  const rows = parseCSVRows(text);
  if(!rows.length) return { count:0, error:"Aucune ligne exploitable (vérifie les en-têtes)." };
  const headers = Object.keys(rows[0]);
  const dateCol = headers.find(h=>/date|jour/i.test(h));
  const valueCol = kind==='steps'
    ? headers.find(h=>/pas|steps/i.test(h))
    : headers.find(h=>/sommeil|sleep/i.test(h));
  if(!dateCol || !valueCol) return { count:0, error:"Colonnes non reconnues. Utilise des en-têtes comme « Date » et « Pas » (ou « Sommeil »)." };
  let count = 0;
  rows.forEach(r=>{
    const date = parseFlexibleDate(r[dateCol]);
    if(!date) return;
    if(kind==='steps'){
      const steps = parseInt((r[valueCol]||'').replace(/\s/g,'').replace(',','.'));
      if(isNaN(steps)) return;
      STATE.stepsLog = STATE.stepsLog.filter(s=>!(s.date===date && s.source==='garmin'));
      STATE.stepsLog.push({ id:uid(), date, steps, source:'garmin' });
      count++;
    } else {
      const h = parseFlexibleHours(r[valueCol]);
      if(h===undefined) return;
      STATE.checkins[date] = STATE.checkins[date] || {};
      STATE.checkins[date].sommeilHeures = h;
      count++;
    }
  });
  saveState();
  return { count };
}

/* ============================= PROGRAMME COURSE A PIED (26 semaines) ============================= */
// Progression douce marche -> course continue, basée sur la tolérance, pas la vitesse.
function buildRunningProgram(){
  const weeks = [];
  const plans = [
    {phase:"Marche", detail:"30 min de marche active, allure confortable, sans essoufflement."},
    {phase:"Marche", detail:"35 min de marche active, allure confortable."},
    {phase:"Marche rapide", detail:"30 min de marche rapide (bras engagés), 2 accélérations de 2 min."},
    {phase:"Marche rapide", detail:"35 min de marche rapide, terrain légèrement vallonné si possible."},
    {phase:"Marche/course", detail:"Alterner 1 min course très lente / 4 min marche, x6 (30 min)."},
    {phase:"Marche/course", detail:"Alterner 1 min course très lente / 3 min marche, x7 (28 min)."},
    {phase:"Marche/course", detail:"Alterner 2 min course très lente / 3 min marche, x6 (30 min)."},
    {phase:"Marche/course", detail:"Alterner 2 min course très lente / 2 min marche, x7 (28 min)."},
    {phase:"Marche/course", detail:"Alterner 3 min course très lente / 2 min marche, x6 (30 min)."},
    {phase:"Marche/course", detail:"Alterner 4 min course très lente / 2 min marche, x5 (30 min)."},
    {phase:"Marche/course", detail:"Alterner 5 min course très lente / 2 min marche, x4 (28 min)."},
    {phase:"Marche/course", detail:"Alterner 6 min course très lente / 2 min marche, x4 (32 min)."},
    {phase:"Marche/course", detail:"Alterner 8 min course très lente / 2 min marche, x3 (30 min)."},
    {phase:"Course très lente", detail:"10 min course très lente, 2 min marche, 10 min course très lente (22 min)."},
    {phase:"Course très lente", detail:"15 min course très lente continue, marche si besoin."},
    {phase:"Course très lente", detail:"18 min course très lente continue."},
    {phase:"Course très lente", detail:"20 min course très lente continue, effort perçu ≤ 5/10."},
    {phase:"Course continue", detail:"22 min course continue à allure très confortable."},
    {phase:"Course continue", detail:"25 min course continue, conversation possible."},
    {phase:"Course continue", detail:"27 min course continue."},
    {phase:"Course continue", detail:"30 min course continue — objectif symbolique atteint."},
    {phase:"Consolidation", detail:"30 min course continue, se concentrer sur le plaisir et la régularité."},
    {phase:"Consolidation", detail:"32 min course continue, allure toujours très confortable."},
    {phase:"Progression douce", detail:"35 min course continue."},
    {phase:"Progression douce", detail:"38 min course continue, terrain varié."},
    {phase:"Entretien", detail:"40 min course continue — maintenir, pas besoin d'aller plus loin pour l'instant."},
  ];
  plans.forEach((p,i)=>{
    weeks.push({
      week:i+1, phase:p.phase,
      sessions:[
        {jour:'Séance 1', echauffement:"5 min marche + mobilité chevilles/hanches", travail:p.detail, recuperation:"5 min marche lente", retourAuCalme:"étirements légers 5 min"},
        {jour:'Séance 2', echauffement:"5 min marche + mobilité chevilles/hanches", travail:p.detail, recuperation:"5 min marche lente", retourAuCalme:"étirements légers 5 min"},
        {jour:'Séance 3 (optionnelle)', echauffement:"5 min marche", travail:p.detail, recuperation:"5 min marche lente", retourAuCalme:"étirements légers 5 min"},
      ]
    });
  });
  return weeks;
}
const RUNNING_PROGRAM = buildRunningProgram();

/* ============================= CORDE A SAUTER (12 mois) ============================= */
function buildJumpRopeProgram(){
  const months = [
    {mois:1, titre:"Prise de contact", series:5, dureeSerie:30, repos:60, note:"Objectif : fluidité du geste."},
    {mois:2, titre:"Endurance légère", series:6, dureeSerie:45, repos:45},
    {mois:3, titre:"Endurance légère", series:6, dureeSerie:60, repos:45},
    {mois:4, titre:"Variation des pas", series:8, dureeSerie:60, repos:40, note:"Pieds joints / alternés."},
    {mois:5, titre:"Enchaînements", series:8, dureeSerie:75, repos:40},
    {mois:6, titre:"Volume", series:10, dureeSerie:75, repos:30},
    {mois:7, titre:"Volume", series:10, dureeSerie:90, repos:30},
    {mois:8, titre:"Intensité modérée", series:8, dureeSerie:90, repos:45, note:"Doubles sauts occasionnels."},
    {mois:9, titre:"Intensité modérée", series:10, dureeSerie:105, repos:30},
    {mois:10, titre:"Consolidation", series:10, dureeSerie:120, repos:30},
    {mois:11, titre:"Consolidation", series:8, dureeSerie:150, repos:30},
    {mois:12, titre:"Bilan annuel", series:12, dureeSerie:120, repos:20, note:"Comparer au mois 1."},
  ];
  months.forEach(m=> m.detail = `${m.series} séries de ${m.dureeSerie} sec, repos ${m.repos} sec entre les séries.${m.note?' '+m.note:''}`);
  return months;
}
const JUMP_ROPE_PROGRAM = buildJumpRopeProgram();

/* ============================= PERSISTANCE ============================= */
// Cache local (instantané, offline) + synchronisation serveur (source de vérité, persistante sur Render).
const STORAGE_KEY = 'cycle_annuel_state_v1';
let _saveTimer = null;
let _syncing = false;
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ console.warn('cache local échoué', e); }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(syncToServer, 500);
}
async function syncToServer(){
  if(typeof fetch==='undefined') return;
  _syncing = true;
  try{
    await fetch('/api/state', {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(STATE),
    });
    setSyncStatus('ok');
  }catch(e){ console.warn('sync serveur échouée, données conservées localement', e); setSyncStatus('error'); }
  _syncing = false;
}
function setSyncStatus(status){
  const el = document.getElementById('sync-dot');
  if(el) el.dataset.status = status;
}
function loadStateLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn('load failed', e); }
  return null;
}
async function loadStateServer(){
  try{
    const r = await fetch('/api/state', { credentials:'include' });
    if(!r.ok) return null;
    const d = await r.json();
    return d.state || null;
  }catch(e){ console.warn('lecture serveur échouée, utilisation du cache local', e); return null; }
}

function macrosOf(name, grams, cruMultiplier){
  const d = NUTRI_DB[name];
  if(!d) return {k:0,p:0,g:0,l:0};
  let factor = grams/100;
  if(d.cru) factor = factor; // grams already indicate raw dry weight for these staples
  return { k:round1(d.k*factor), p:round1(d.p*factor), g:round1(d.g*factor), l:round1(d.l*factor) };
}
function sumMacros(list){
  return list.reduce((acc,it)=>{
    const m = macrosOf(it.name, it.grams);
    acc.k+=m.k; acc.p+=m.p; acc.g+=m.g; acc.l+=m.l; return acc;
  },{k:0,p:0,g:0,l:0});
}

function isForbidden(recipe, forbidden){
  const banned = (forbidden.banned||[]).map(s=>s.toLowerCase());
  return recipe.ingredients.some(ing=> banned.some(b=> ing.name.toLowerCase().includes(b)));
}
function recipesFor(slot, season, forbidden){
  return RECIPES.filter(r=> r.slot===slot && r.seasons.includes(season) && !isForbidden(r, forbidden));
}
function menuForDate(dateStr, forbidden){
  const season = seasonOf(dateStr);
  const slots = ['petitdej','dejeuner','collation','diner'];
  const out = {};
  slots.forEach(slot=>{
    let pool = recipesFor(slot, season, forbidden);
    if(!pool.length) pool = RECIPES.filter(r=>r.slot===slot && !isForbidden(r, forbidden));
    out[slot] = pickDeterministic(pool, dateStr+slot) || null;
  });
  return out;
}

/* ============================= CALCULS PROFIL ============================= */
function bmr(profile){
  // Mifflin-St Jeor, femme
  return Math.round(10*profile.poids + 6.25*profile.taille - 5*profile.age - 161);
}
const KCAL_MIN = 1600, PROTEIN_MIN = 150;
function calorieTarget(profile){
  // activité légère à modérée, déficit doux et progressif (pas de restriction sévère) — jamais sous le minimum fixé
  const base = bmr(profile) * 1.4;
  return Math.max(KCAL_MIN, Math.round(base - 250));
}
function proteinTarget(profile){
  return Math.max(PROTEIN_MIN, Math.round(profile.poids * 1.6));
}
function stepsGoalFor(dateStr){
  const w = Math.max(0, weekIndexSince(STATE.profile.dateDebut, dateStr));
  const goal = STATE.profile.pasBase + Math.min(w, 40) * 150; // progression douce, plafond ~8000 après ~40 semaines
  return clamp(Math.round(goal/100)*100, STATE.profile.pasBase, 8500);
}

function generateShoppingList(){
  const start = todayStr();
  const items = {};
  for(let i=0;i<7;i++){
    const date = addDays(start,i);
    const menu = menuForDate(date, STATE.forbidden);
    Object.values(menu).forEach(recipe=>{
      if(!recipe) return;
      recipe.ingredients.forEach(ing=>{
        if(!items[ing.name]) items[ing.name]={name:ing.name, grams:0, bought:false, rayon:rayonOf(ing.name)};
        items[ing.name].grams += ing.grams;
      });
    });
  }
  STATE.shoppingList = { weekOf:start, items:Object.values(items) };
  saveState();
}

const KANBAN_COLS = [['todo','📝 À faire'],['doing','🔄 En cours'],['done','✅ Terminé']];
function renderKanban(){
  return `

function renderKcard(t,colId){
  const prioColor = t.priorite==='haute'?'warn':t.priorite==='moyenne'?'gold':'muted';
  const idx = KANBAN_COLS.findIndex(c=>c[0]===colId);
  return `
  <div class="kcard">
    <div class="kcard-title">${t.titre}</div>
    <div class="row wrap" style="gap:4px;">
      <span class="pill ${prioColor}" style="font-size:10px;padding:2px 8px;">${t.priorite}</span>
      ${t.echeance?`<span class="pill muted" style="font-size:10px;padding:2px 8px;">⏰ ${fmtDateShort(t.echeance)}</span>`:''}
      ${t.repetition && t.repetition!=='aucune'?`<span class="pill muted" style="font-size:10px;padding:2px 8px;">↻ ${t.repetition}</span>`:''}
    </div>
    <div class="kcard-meta">
      ${idx>0?`<button class="link-btn" data-action="move-task" data-id="${t.id}" data-from="${colId}" data-dir="-1">← déplacer</button>`:''}
      ${idx<2?`<button class="link-btn" data-action="move-task" data-id="${t.id}" data-from="${colId}" data-dir="1">déplacer →</button>`:''}
      <button class="link-btn" data-action="edit-task" data-id="${t.id}" data-from="${colId}">modifier</button>
      <button class="link-btn" data-action="delete-task" data-id="${t.id}" data-from="${colId}" style="color:var(--danger)">supprimer</button>
    </div>
  </div>`;
}

/* ============================= CALENDRIER ============================= */
const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DOW_NAMES = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function renderCalendrier(){
  const y = UI.calYear, m = UI.calMonth;
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(toISO(new Date(y,m,d)));
  const today = todayStr();
  const sel = UI.calSelected;
  const selPlanned = plannedForDate(sel);
  const selDone = doneTypesForDate(sel);
  const selApts = STATE.appointments.filter(a=>a.date===sel);
  return `
  <div class="row between section">
    <button class="btn icon" data-action="cal-month" data-delta="-1">‹</button>
    <h2 style="font-size:16px;">${MONTH_NAMES[m]} ${y}</h2>
    <button class="btn icon" data-action="cal-month" data-delta="1">›</button>
  </div>
  <div class="cal-grid" style="margin-bottom:6px;">${DOW_NAMES.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
  <div class="cal-grid section">
    ${cells.map(dateStr=>{
      if(!dateStr) return `<div></div>`;
      const planned = plannedForDate(dateStr).filter(p=>p!=='repos');
      const done = doneTypesForDate(dateStr);
      return `<div class="cal-cell ${dateStr===today?'today':''}" data-action="cal-select" data-date="${dateStr}">
        <div class="d-num">${parseISO(dateStr).getDate()}</div>
        <div class="cal-dots">${planned.slice(0,4).map(p=>`<div class="cal-dot ${done.includes(p)?'done':''}"></div>`).join('')}</div>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <div class="eyebrow">${capitalize(fmtDateLong(sel))}</div>
    <div class="row wrap" style="margin:8px 0;">
      ${selPlanned.map(p=>`<span class="pill ${selDone.includes(p)?'gold':'muted'}">${ACTIVITY_LABEL[p]}</span>`).join('')}
    </div>
    <button class="btn sm" data-action="edit-day-plan" data-date="${sel}">Modifier le planning de ce jour</button>
    <hr class="sep">
    <div class="eyebrow">Rendez-vous</div>
    ${selApts.length? selApts.map(a=>`<div class="list-item">${a.heure||''} — ${a.title} ${a.notes?('· '+a.notes):''} <button class="btn icon sm" data-action="delete-apt" data-id="${a.id}">✕</button></div>`).join(''):'<div class="empty">Aucun</div>'}
    <button class="btn sm" style="margin-top:8px;" data-action="open-apt-add" data-date="${sel}">+ Ajouter un rendez-vous</button>
  </div>
  `;
}

/* ============================= PROGRESSION ============================= */
function renderProgression(){
  const period = UI.progressPeriod;
  const since = addDays(todayStr(), -period);
  const steps = STATE.stepsLog.filter(s=>s.date>=since).reduce((a,s)=>a+s.steps,0);
  const distMarche = STATE.stepsLog.filter(s=>s.date>=since).reduce((a,s)=>a+(s.distance||0),0);
  const runs = STATE.sessionsLog.filter(s=>s.type==='course' && s.date>=since);
  const distCourse = runs.reduce((a,r)=>a+(r.distance||0),0);
  const tempsCourse = runs.reduce((a,r)=>a+(r.dureeContinue||r.duree||0),0);
  const bestRun = STATE.sessionsLog.filter(s=>s.type==='course').reduce((m,r)=>Math.max(m,r.dureeContinue||0),0);
  const counts = {};
  ['tapis','spinning','elliptique','corde','tractions','renforcement'].forEach(t=> counts[t]=STATE.sessionsLog.filter(s=>s.type===t && s.date>=since).length);
  const pilatesDone = STATE.pilatesLibrary.filter(v=>v.done).length;
  const tasksDone = STATE.kanban.done.length;
  const earned = BADGE_DEFS.filter(b=>b.check(STATE));
  const checkinsInPeriod = Object.entries(STATE.checkins).filter(([d])=>d>=since).map(([,c])=>c);
  const avgSleep = checkinsInPeriod.filter(c=>c.sommeilHeures!==undefined).length? round1(checkinsInPeriod.reduce((a,c)=>a+(c.sommeilHeures||0),0)/checkinsInPeriod.filter(c=>c.sommeilHeures!==undefined).length) : null;
  const avgMood = checkinsInPeriod.filter(c=>c.ressenti).length? round1(checkinsInPeriod.reduce((a,c)=>a+(c.ressenti||0),0)/checkinsInPeriod.filter(c=>c.ressenti).length) : null;
  return `
  <div class="subtabs">
    ${[7,30,90,180,365].map(p=>`<button class="${period===p?'active':''}" data-action="set-period" data-period="${p}">${p<30?p+'j':p===365?'12 mois':Math.round(p/30)+' mois'}</button>`).join('')}
  </div>
  <div class="grid-2 section">
    <div class="tile"><div class="tile-label">Pas cumulés</div><div class="tile-val num">${steps.toLocaleString('fr-FR')}</div></div>
    <div class="tile"><div class="tile-label">Distance marchée</div><div class="tile-val num">${round1(distMarche)} km</div></div>
    <div class="tile"><div class="tile-label">Distance courue</div><div class="tile-val num">${round1(distCourse)} km</div></div>
    <div class="tile"><div class="tile-label">Temps de course</div><div class="tile-val num">${tempsCourse} min</div></div>
    <div class="tile"><div class="tile-label">Meilleure course continue</div><div class="tile-val num">${bestRun} min</div></div>
    <div class="tile"><div class="tile-label">Tâches terminées</div><div class="tile-val num">${tasksDone}</div></div>
    <div class="tile"><div class="tile-label">Sommeil moyen</div><div class="tile-val num">${avgSleep!==null?avgSleep+' h':'—'}</div></div>
    <div class="tile"><div class="tile-label">Ressenti moyen</div><div class="tile-val num">${avgMood!==null?MOODS.find(m=>m.v===Math.round(avgMood))?.e+' '+avgMood:'—'}</div></div>
  </div>
  <div class="grid-3 section">
    <div class="tile"><div class="tile-label">Tapis</div><div class="tile-val num">${counts.tapis}</div></div>
    <div class="tile"><div class="tile-label">Spinning</div><div class="tile-val num">${counts.spinning}</div></div>
    <div class="tile"><div class="tile-label">Elliptique</div><div class="tile-val num">${counts.elliptique}</div></div>
    <div class="tile"><div class="tile-label">Corde</div><div class="tile-val num">${counts.corde}</div></div>
    <div class="tile"><div class="tile-label">Renforcement</div><div class="tile-val num">${counts.renforcement}</div></div>
    <div class="tile"><div class="tile-label">Pilates</div><div class="tile-val num">${pilatesDone}</div></div>
  </div>
  <div class="section">
    <div class="section-title"><h2>Poids</h2></div>
    <div class="card chart-wrap"><canvas id="chart-poids"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title"><h2>Pas quotidiens</h2></div>
    <div class="card chart-wrap"><canvas id="chart-pas"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title"><h2>Mensurations</h2></div>
    <div class="card chart-wrap"><canvas id="chart-mensu"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title"><h2>Badges</h2></div>
    <div class="grid-3">
      ${BADGE_DEFS.map(b=>`<div class="tile" style="text-align:center;opacity:${earned.includes(b)?1:0.35};"><div class="badge-emoji">${b.icon}</div><div class="tile-sub">${b.name}</div></div>`).join('')}
    </div>
  </div>
  `;
}
function drawProgressionCharts(){
  if(typeof Chart==='undefined') return;
  const period = UI.progressPeriod;
  const since = addDays(todayStr(), -period);
  const commonOpts = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(120,120,120,0.15)'}}}};
  const wLog = STATE.weightLog.filter(w=>w.date>=since);
  const ctxW = $('#chart-poids');
  if(ctxW){ new Chart(ctxW, {type:'line', data:{labels:wLog.map(w=>fmtDateShort(w.date)), datasets:[{data:wLog.map(w=>w.poids), borderColor:'#8451D9', backgroundColor:'rgba(132,81,217,0.15)', fill:true, tension:0.3, pointRadius:2}]}, options:commonOpts}); }
  const sLog = STATE.stepsLog.filter(s=>s.date>=since);
  const byDate = {}; sLog.forEach(s=>{ byDate[s.date]=(byDate[s.date]||0)+s.steps; });
  const dates = Object.keys(byDate).sort();
  const ctxP = $('#chart-pas');
  if(ctxP){ new Chart(ctxP, {type:'bar', data:{labels:dates.map(fmtDateShort), datasets:[{data:dates.map(d=>byDate[d]), backgroundColor:'#D9459E'}]}, options:commonOpts}); }
  const mLog = STATE.measurementsLog.filter(m=>m.date>=since);
  const ctxM = $('#chart-mensu');
  if(ctxM){ new Chart(ctxM, {type:'line', data:{labels:mLog.map(m=>fmtDateShort(m.date)), datasets:[
    {label:'Tour de taille',data:mLog.map(m=>m.tourDeTaille),borderColor:'#8451D9',tension:.3,pointRadius:2},
    {label:'Hanches',data:mLog.map(m=>m.hanches),borderColor:'#3E7BD9',tension:.3,pointRadius:2},
  ]}, options:Object.assign({},commonOpts,{plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:10}}}}})}); }
}

      <div class="field"><label>Durée de course continue (min)</label><input type="number" id="m-continue"></div>
      <div class="field"><label>Distance (km)</label><input type="number" step="0.1" id="m-distance"></div>
      <div class="field"><label>Vitesse moyenne (km/h)</label><input type="number" step="0.1" id="m-vitesse"></div>
      <div class="field"><label>Fréquence cardiaque (bpm, optionnel)</label><input type="number" id="m-fc"></div>
      <div class="field"><label>Effort perçu (1-10)</label><input type="number" min="1" max="10" id="m-rpe"></div>
      <div class="field"><label>Essoufflement (1-10)</label><input type="number" min="1" max="10" id="m-essouf"></div>
    `:''}
    ${isCardio?`
      <div class="field"><label>Type de séance</label><input type="text" id="m-variante" placeholder="ex. endurance, intervalles, marche rapide"></div>
      <div class="field"><label>Durée (min)</label><input type="number" id="m-duree"></div>
      <div class="field"><label>Vitesse (km/h)</label><input type="number" step="0.1" id="m-vitesse"></div>
      ${type==='tapis'?`<div class="field"><label>Inclinaison (%)</label><input type="number" step="0.5" id="m-inclinaison"></div>`:''}
      <div class="field"><label>Distance (km)</label><input type="number" step="0.1" id="m-distance"></div>
    `:''}
    ${isCorde?(()=>{
      const monthIdx = clamp(Math.floor(weekIndexSince(STATE.profile.dateDebut,todayStr())/4.33),0,11);
      const plan = JUMP_ROPE_PROGRAM[monthIdx];
      return `
      <div class="field"><label>Nombre de séries</label><input type="number" id="m-series" value="${plan.series}"></div>
      <div class="field"><label>Durée par série (sec)</label><input type="number" id="m-dureeserie" value="${plan.dureeSerie}"></div>
      <div class="field"><label>Repos entre les séries (sec)</label><input type="number" id="m-recup" value="${plan.repos}"></div>
      <div class="field"><label>Difficulté ressentie (1-10)</label><input type="number" min="1" max="10" id="m-difficulte"></div>
    `; })():''}
    ${isTraction?(()=>{ const st=PULLUP_STAGES[STATE.pullup.stage-1]; return `
      <div class="field"><label>Étape</label><input type="number" id="m-stage" value="${STATE.pullup.stage}" min="1" max="10"></div>
      <div class="field"><label>Séries</label><input type="number" id="m-series" value="${st.series}"></div>
      <div class="field"><label>Répétitions</label><input type="text" id="m-reps" value="${st.reps}"></div>
      <div class="field"><label>Repos entre les séries (sec)</label><input type="number" id="m-repos" value="${st.repos}"></div>
    `; })():''}
    ${isRenfo?(()=>{
      const exos = STRENGTH_EXERCISES[STATE.strengthLevel];
      return `<div class="field"><label>Niveau</label><input type="text" id="m-level" value="${STATE.strengthLevel}" readonly></div>
      <div class="eyebrow" style="margin:10px 0 4px;">Charges utilisées (kg, si applicable)</div>
      ${exos.map((e,i)=>`
        <div class="field" data-exo-row>
          <label>${e.name} — ${e.series} séries x ${e.reps} · repos ${e.repos}s</label>
          <input type="number" step="0.5" class="exo-poids" data-exo-name="${e.name}" data-exo-series="${e.series}" data-exo-reps="${e.reps}" data-exo-repos="${e.repos}" placeholder="${e.poids?'poids (kg)':'poids du corps'}">
        </div>`).join('')}`;
    })():''}
    <div class="field"><label>Commentaire</label><textarea id="m-comment"></textarea></div>
    <button class="btn primary" data-action="save-session" data-type="${type}">Enregistrer</button>
  `);
}

/* ============================= ACTIONS ============================= */
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function numval(id){ const v=val(id); return v===''?undefined:parseFloat(v); }

document.addEventListener('click', e=>{
  const backdrop = e.target.closest('[data-action="close-modal"]');
  if(backdrop && e.target===backdrop){ closeModal(); return; }
  if(e.target.closest('[data-stop]')){ /* click inside modal: fine, may still match other actions below */ }

  const nav = e.target.closest('[data-nav]');
  if(nav){ UI.tab = nav.dataset.nav; if(nav.dataset.sub) UI.sportSub = nav.dataset.sub; render(); return; }

  const subtab = e.target.closest('[data-subtab]');
  if(subtab){
    const [group,id] = subtab.dataset.subtab.split(':');
    if(group==='nutrition') UI.nutritionSub=id; else if(group==='sport') UI.sportSub=id; else if(group==='profil') UI.profilSub=id;
    render(); return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const a = btn.dataset.action;

  switch(a){
    case 'quick-steps': modalSteps(); break;
    case 'open-steps': modalSteps(); break;
    case 'save-steps': {
      const s = { id:uid(), date:val('m-date')||todayStr(), steps:numval('m-pas')||0, duree:numval('m-duree'), distance:numval('m-distance'), comment:val('m-comment') };
      STATE.stepsLog.push(s); saveState(); closeModal(); toast('Pas enregistrés'); render(); break;
    }
    case 'delete-steps': STATE.stepsLog = STATE.stepsLog.filter(s=>s.id!==btn.dataset.id); saveState(); render(); break;

    case 'open-add-activity': modalAddActivity(); break;
    case 'save-activity': {
      const type = val('m-activite');
      STATE.sessionsLog.push({ id:uid(), type, date:val('m-date')||todayStr(), duree:numval('m-duree'), distance:numval('m-distance'), intensite:numval('m-intensite'), comment:val('m-comment'), nonPrevue:true });
      saveState(); closeModal(); toast('Activité enregistrée'); render(); break;
    }

    case 'open-log': modalLogSession(btn.dataset.type); break;
    case 'save-session': {
      const type = btn.dataset.type;
      const base = { id:uid(), type, date:val('m-date')||todayStr(), comment:val('m-comment') };
      if(type==='course') Object.assign(base,{duree:numval('m-duree'), dureeContinue:numval('m-continue'), distance:numval('m-distance'), vitesse:numval('m-vitesse'), fc:numval('m-fc'), rpe:numval('m-rpe'), essoufflement:numval('m-essouf')});
      if(['tapis','spinning','elliptique'].includes(type)) Object.assign(base,{variante:val('m-variante'), duree:numval('m-duree'), vitesse:numval('m-vitesse'), inclinaison:numval('m-inclinaison'), distance:numval('m-distance')});
      if(type==='corde') Object.assign(base,{series:numval('m-series'), dureeSerie:numval('m-dureeserie'), recup:numval('m-recup'), repos:numval('m-recup'), difficulte:numval('m-difficulte')});
      if(type==='tractions'){
        const stage = numval('m-stage')||STATE.pullup.stage;
        const entry = { id:uid(), date:base.date, stage, series:numval('m-series'), reps:val('m-reps'), repos:numval('m-repos'), comment:base.comment };
        STATE.pullup.log.push(entry);
        Object.assign(base,entry);
      }
      if(type==='renforcement'){
        const exercices = $$('.exo-poids').map(inp=>({
          name:inp.dataset.exoName, series:parseInt(inp.dataset.exoSeries), reps:inp.dataset.exoReps,
          repos:parseInt(inp.dataset.exoRepos), poids: inp.value? parseFloat(inp.value): undefined,
        }));
        const entry = {id:uid(), date:base.date, level:STATE.strengthLevel, comment:base.comment, exercices};
        STATE.strengthLog.push(entry);
        Object.assign(base,{level:STATE.strengthLevel, exercices});
      }
      STATE.sessionsLog.push(base);
      saveState(); closeModal(); toast('Séance enregistrée'); checkNewBadges(); render(); break;
    }
    case 'delete-session': STATE.sessionsLog = STATE.sessionsLog.filter(s=>s.id!==btn.dataset.id); saveState(); render(); break;

    case 'pullup-advance': STATE.pullup.stage = clamp(STATE.pullup.stage+1,1,10); saveState(); render(); break;
    case 'pullup-back': STATE.pullup.stage = clamp(STATE.pullup.stage-1,1,10); saveState(); render(); break;
    case 'set-strength-level': STATE.strengthLevel = btn.dataset.level; saveState(); render(); break;

    case 'open-pilates-add': modalPilatesAdd(); break;
    case 'save-pilates': {
      const url = val('m-url');
      if(!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(url)){ toast('Lien YouTube invalide'); return; }
      STATE.pilatesLibrary.push({ id:uid(), name:val('m-name')||'Sans titre', url, duree:numval('m-duree')||15, niveau:val('m-niveau'), objectif:val('m-objectif'), categorie:'Pilates', date:val('m-date')||null, done:false });
      saveState(); closeModal(); render(); break;
    }
    case 'toggle-pilates-done': { const v=STATE.pilatesLibrary.find(x=>x.id===btn.dataset.id); if(v){v.done=!v.done; saveState(); checkNewBadges(); render();} break; }
    case 'delete-pilates': STATE.pilatesLibrary = STATE.pilatesLibrary.filter(v=>v.id!==btn.dataset.id); saveState(); render(); break;

    case 'open-task-add': modalTaskEdit(null,'todo'); break;
    case 'edit-task': { const t=STATE.kanban[btn.dataset.from].find(x=>x.id===btn.dataset.id); modalTaskEdit(t, btn.dataset.from); break; }
    case 'save-task': {
      const id = btn.dataset.id, from = btn.dataset.from;
      const data = { titre:val('m-titre'), priorite:val('m-priorite'), date:val('m-date'), echeance:val('m-echeance'), repetition:val('m-repetition') };
      if(id){ const t = STATE.kanban[from].find(x=>x.id===id); Object.assign(t,data); }
      else { STATE.kanban[from].push(Object.assign({id:uid()},data)); }
      saveState(); closeModal(); render(); break;
    }
    case 'delete-task': STATE.kanban[btn.dataset.from] = STATE.kanban[btn.dataset.from].filter(x=>x.id!==btn.dataset.id); saveState(); render(); break;
    case 'move-task': {
      const cols = ['todo','doing','done']; const from = btn.dataset.from; const idx = cols.indexOf(from)+parseInt(btn.dataset.dir);
      if(idx<0||idx>2) return;
      const to = cols[idx];
      const t = STATE.kanban[from].find(x=>x.id===btn.dataset.id);
      STATE.kanban[from] = STATE.kanban[from].filter(x=>x.id!==btn.dataset.id);
      STATE.kanban[to].push(t);
      saveState(); checkNewBadges(); render(); break;
    }

    case 'cal-month': { UI.calMonth+=parseInt(btn.dataset.delta); if(UI.calMonth<0){UI.calMonth=11;UI.calYear--;} if(UI.calMonth>11){UI.calMonth=0;UI.calYear++;} render(); break; }
    case 'cal-select': UI.calSelected = btn.dataset.date; render(); break;
    case 'edit-day-plan': modalDayPlan(btn.dataset.date); break;
    case 'save-day-plan': {
      const cbs = $$('.dayplan-cb').filter(c=>c.checked).map(c=>c.value);
      setPlannedForDate(btn.dataset.date, cbs.length?cbs:['repos']); closeModal(); render(); break;
    }
    case 'open-apt-add': modalAppointment(btn.dataset.date); break;
    case 'save-apt': { STATE.appointments.push({id:uid(), date:val('m-date'), heure:val('m-heure'), title:val('m-titre'), notes:val('m-notes')}); saveState(); closeModal(); render(); break; }
    case 'delete-apt': STATE.appointments = STATE.appointments.filter(a=>a.id!==btn.dataset.id); saveState(); render(); break;

    case 'nut-day': UI.nutritionDate = addDays(UI.nutritionDate, parseInt(btn.dataset.delta)); render(); break;
    case 'swap-meal': { const slot=btn.dataset.slot; STATE.mealOverrides = STATE.mealOverrides||{}; const key=UI.nutritionDate+slot;
      const season = seasonOf(UI.nutritionDate); let pool = recipesFor(slot, season, STATE.forbidden);
      if(pool.length>1){ const cur = menuForDate(UI.nutritionDate, STATE.forbidden)[slot]; pool = pool.filter(r=>r.id!==cur.id); }
      const pick = pool[Math.floor(Math.random()*pool.length)];
      STATE.mealOverrides[key]=pick?pick.id:null; saveState(); render(); break; }
    case 'add-food': {
      const kind = btn.dataset.kind; const inputId = kind==='favorite'?'fav-input':kind==='limited'?'lim-input':'ban-input';
      const name = val(inputId).trim(); if(!name) return;
      if(!STATE.forbidden[kind].includes(name)) STATE.forbidden[kind].push(name);
      saveState(); render(); break;
    }
    case 'remove-food': { const kind=btn.dataset.kind; STATE.forbidden[kind]=STATE.forbidden[kind].filter(n=>n!==btn.dataset.name); saveState(); render(); break; }
    case 'gen-shopping': generateShoppingList(); render(); break;
    case 'toggle-bought': { const it = STATE.shoppingList.items.find(i=>i.name===btn.closest('[data-name]')?.dataset.name || btn.dataset.name); break; }

    case 'open-weight': modalWeight(); break;
    case 'save-weight': { const w={id:uid(), date:val('m-date')||todayStr(), poids:numval('m-poids'), comment:val('m-comment')}; STATE.weightLog.push(w); STATE.profile.poids=w.poids; saveState(); closeModal(); toast('Pesée enregistrée'); render(); break; }
    case 'delete-weight': STATE.weightLog = STATE.weightLog.filter(w=>w.id!==btn.dataset.id); saveState(); render(); break;
    case 'open-measurements': modalMeasurements(); break;
    case 'save-measurements': {
      const m = {id:uid(), date:val('m-date')||todayStr()};
      MEASUREMENT_FIELDS.forEach(([k])=>{ const v=numval('m-'+k); if(v!==undefined) m[k]=v; });
      const cn = val('m-custom-name'), cv = numval('m-custom-val');
      if(cn && cv!==undefined){ m.custom = m.custom||{}; m.custom[cn]=cv; }
      STATE.measurementsLog.push(m); saveState(); closeModal(); render(); break;
    }
    case 'open-impedance': modalImpedance(); break;
    case 'save-impedance': {
      const m = {id:uid(), date:val('m-date')||todayStr()};
      ['poids','masseGrasse','masseMusculaire','eau','masseOsseuse','graisseViscerale','metabolisme'].forEach(k=>{ const v=numval('m-'+k); if(v!==undefined) m[k]=v; });
      STATE.impedanceLog.push(m); saveState(); closeModal(); render(); break;
    }
    case 'open-water': modalWater(); break;
    case 'water-adjust': { const t=todayStr(); STATE.hydration[t]=Math.max(0,(STATE.hydration[t]||0)+parseInt(btn.dataset.delta)); saveState(); modalWater(); break; }

    case 'import-garmin': {
      const text = val('garmin-csv');
      const res = importGarminCSV(text, btn.dataset.kind);
      const out = $('#garmin-result');
      if(out) out.textContent = res.error ? ('⚠️ '+res.error) : `✓ ${res.count} entrée(s) importée(s).`;
      if(!res.error){ toast('Import Garmin terminé'); render(); }
      break;
    }
    case 'logout': fetch('/api/logout',{method:'POST'}).then(()=>{ window.location.href='/login.html'; }); break;

    case 'set-mood': { const t=todayStr(); STATE.checkins[t]=STATE.checkins[t]||{}; STATE.checkins[t].ressenti=parseInt(btn.dataset.v); saveState(); render(); break; }
    case 'save-checkin': { const t=todayStr(); STATE.checkins[t]=STATE.checkins[t]||{};
      const h = numval('sleep-hours'); if(h!==undefined) STATE.checkins[t].sommeilHeures=h;
      const q = val('sleep-quality'); if(q) STATE.checkins[t].sommeilQualite=q;
      saveState(); toast('Ressenti & sommeil enregistrés'); render(); break; }

    case 'save-profile': {
      ['age','taille','poids','masseGrasse','pasBase'].forEach(k=>{ const v=numval('m-'+k===undefined?k:k); });
      $$('.field input[data-field],.field select[data-field]').forEach(inp=>{
        const f = inp.dataset.field; const v = inp.type==='number'?parseFloat(inp.value):inp.value;
        STATE.profile[f]=v;
      });
      saveState(); toast('Profil mis à jour'); render(); break;
    }
    case 'save-goals': {
      $$('[data-goal]').forEach(inp=>{
        const path = inp.dataset.goal.split('.'); let obj=STATE.goals; for(let i=0;i<path.length-1;i++) obj=obj[path[i]];
        obj[path[path.length-1]] = inp.type==='number'?parseFloat(inp.value):inp.value;
      });
      saveState(); toast('Objectifs mis à jour'); render(); break;
    }
    case 'add-habit': { const v=val('habit-input').trim(); if(!v) return; STATE.goals.habitudes.push({id:uid(), label:v, actif:true}); saveState(); render(); break; }
    case 'toggle-habit': { const h=STATE.goals.habitudes.find(x=>x.id===btn.dataset.id); if(h){h.actif=!h.actif; saveState();} break; }
    case 'delete-habit': STATE.goals.habitudes = STATE.goals.habitudes.filter(h=>h.id!==btn.dataset.id); saveState(); render(); break;
    case 'toggle-notif': STATE.settings.notif[btn.dataset.key] = !STATE.settings.notif[btn.dataset.key]; saveState(); break;
    case 'reset-all': if(confirm('Réinitialiser toutes les données ? Cette action est irréversible.')){ localStorage.removeItem(STORAGE_KEY); STATE = defaultState(); saveState(); render(); } break;
    case 'set-period': UI.progressPeriod = parseInt(btn.dataset.period); render(); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-action="toggle-bought"]')){

});
function checkNewBadges(){
  const earned = BADGE_DEFS.filter(b=>b.check(STATE));
  STATE._badges = STATE._badges||[];
  earned.forEach(b=>{ if(!STATE._badges.includes(b.id)){ STATE._badges.push(b.id); toast('🏅 Badge débloqué : '+b.name); } });
  saveState();
}

/* menuForDate doit tenir compte des variations manuelles (swap) et garantir les minimums kcal/protéines */
function computeComplement(totals){
  const proteinGap = Math.max(0, PROTEIN_MIN - totals.p);
  const ingredients = [];
  let addedK = 0, addedP = 0;
  if(proteinGap > 0.5){
    const grams = round1(proteinGap/75*100);
    ingredients.push({name:"Poudre de protéine végétale", grams});
    const m = macrosOf("Poudre de protéine végétale", grams);
    addedK += m.k; addedP += m.p;
  }
  const kcalGap = Math.max(0, KCAL_MIN - (totals.k + addedK));
  if(kcalGap > 10){
    const grams = round1(kcalGap/579*100);
    ingredients.push({name:"Amandes", grams});
  }
  if(!ingredients.length) return null;
  return { slot:'complement', name:'Complément du jour', ingredients, macros: sumMacros(ingredients),
    recette:"À répartir sur la journée : par exemple la poudre de protéine dans un yaourt ou un smoothie, les amandes en collation.",
    variante:"Remplacer la poudre de protéine végétale par un supplément de ton choix, ou par 200 g de skyr / fromage blanc supplémentaire." };
}
const _origMenuForDate = menuForDate;
menuForDate = function(dateStr, forbidden){
  const base = _origMenuForDate(dateStr, forbidden);
  if(STATE && STATE.mealOverrides){
    Object.keys(base).forEach(slot=>{
      const key = dateStr+slot;
      if(STATE.mealOverrides[key]){ const r = RECIPES.find(x=>x.id===STATE.mealOverrides[key]); if(r) base[slot]=r; }
    });
  }
  const totals = ['petitdej','dejeuner','collation','diner'].reduce((a,s)=>{ if(base[s]){a.k+=base[s].macros.k;a.p+=base[s].macros.p;} return a; },{k:0,p:0});
  base.complement = computeComplement(totals);
  return base;
};

function renderSportLibre(){
  const logs = STATE.sessionsLog.filter(s=>s.type==='autre'||s.nonPrevue).sort((a,b)=>b.date.localeCompare(a.date));
  return `

    <div class="eyebrow">Activité réalisée spontanément</div>
    <div class="recipe-text">Une activité non prévue au programme ? Enregistre-la ici en deux clics.</div>
    <button class="btn primary" style="margin-top:10px;" data-action="open-add-activity">+ Ajouter une activité</button>
  </div>
  <div class="section-title"><h2>Historique</h2></div>
  ${logs.length? logs.slice(0,20).map(r=>`
    <div class="list-item"><div style="flex:1;">${fmtDateShort(r.date)} — ${ACTIVITY_LABEL[r.type]||r.type} · ${r.duree||''} min ${r.distance?('· '+r.distance+' km'):''} ${r.comment?('· '+r.comment):''}</div>
    <button class="btn icon sm" data-action="delete-session" data-id="${r.id}">✕</button></div>`).join('') : '<div class="empty">Aucune activité libre enregistrée.</div>'}
  `;
}

(async function boot(){
  const serverState = await loadStateServer();
  if(serverState){
    STATE = serverState;
    ensureShape();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
    render();
  } else {
    // pas d'état côté serveur : on pousse l'état local (première visite)
    syncToServer();
  }
})();
